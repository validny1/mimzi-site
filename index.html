<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MIMZI — MIMZI</title>
<link rel="icon" href="icon.png">
<style>
:root { --bg: #0F1420; --card: #161C2A; --border: #26304A; --text: #E8EEF8; --muted: #93A0B8; --accent: #22E3F2; --violet: #7B61FF; --mark: #FFE27A; }
@media (prefers-color-scheme: light) {
  :root { --bg: #F4F7FB; --card: #FFFFFF; --border: #DCE3EE; --text: #141A26; --muted: #5B6578; --accent: #0091B3; --violet: #6A4FE6; --mark: #FFE27A; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
.wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
header img { width: 48px; height: 48px; border-radius: 12px; }
header a { color: var(--text); text-decoration: none; font-weight: 900; font-size: 22px; letter-spacing: 0.5px; }
h1 { font-size: 28px; line-height: 1.25; margin: 0 0 6px; }
h2 { font-size: 19px; margin: 28px 0 8px; }
.meta { color: var(--muted); margin: 0 0 20px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 18px 20px; margin: 16px 0; }
.draft { border-color: var(--mark); }
ul { padding-left: 22px; margin: 8px 0; }
li { margin: 4px 0; }
p { margin: 8px 0; }
.card h2:first-child { margin-top: 0; }
a { color: var(--accent); }
mark { background: var(--mark); color: #141A26; border-radius: 4px; padding: 0 3px; }
.lang { display: flex; gap: 8px; margin: 0 0 8px; }
.lang a { border: 1px solid var(--border); border-radius: 999px; padding: 4px 12px; text-decoration: none; font-size: 14px; }
ol.steps { padding-left: 22px; }
ol.steps li { margin: 8px 0; }
.links a { display: block; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px 18px; margin: 12px 0; color: var(--text); text-decoration: none; font-weight: 700; }
.links a span { display: block; color: var(--muted); font-weight: 400; font-size: 14px; }
footer { color: var(--muted); font-size: 13px; margin-top: 40px; }
</style>
</head>
<body>
<div class="wrap">
<header><img src="icon.png" alt=""><a href="./">MIMZI</a></header>
<h1>MIMZI</h1>
<p class="meta">Мемы, посты и общение. / Memes, posts and chatting.</p>
<div class="links">
<a href="privacy.html">Политика конфиденциальности<span>Privacy policy</span></a>
<a href="delete-account.html">Удаление аккаунта<span>Account deletion</span></a>
</div>
<p>Связь / Contact: mimzi.dev@yandex.ru</p>
<footer>MIMZI · 26.10.2026</footer>
</div>
</body>
</html>
